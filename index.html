    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "#8055f1",
                foreground: "#ffffff",
              },
              secondary: {
                DEFAULT: "#e6e1fd",
                foreground: "#441170",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            keyframes: {
              "accordion-down": {
                from: { height: 0 },
                to: { height: "var(--radix-accordion-content-height)" },
              },
              "accordion-up": {
                from: { height: "var(--radix-accordion-content-height)" },
                to: { height: 0 },
              },
              "enter": {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "enter-subtle": {
                "0%": { opacity: "0", transform: "translateY(2px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "fade-in": {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              "slide-in-right": {
                "0%": { opacity: "0", transform: "translateX(20px)" },
                "100%": { opacity: "1", transform: "translateX(0)" },
              },
              "slide-in-from-right": {
                "0%": { transform: "translateX(100%)" },
                "100%": { transform: "translateX(0)" },
              },
              "slide-out-to-right": {
                "0%": { transform: "translateX(0)" },
                "100%": { transform: "translateX(100%)" },
              },
              "fade-out": {
                "0%": { opacity: "1" },
                "100%": { opacity: "0" },
              },
            },
            animation: {
              "accordion-down": "accordion-down 0.2s ease-out",
              "accordion-up": "accordion-up 0.2s ease-out",
              "enter": "enter 0.25s ease-out forwards",
              "enter-subtle": "enter-subtle 0.15s ease-out forwards",
              "fade-in": "fade-in 0.3s ease-out forwards",
              "slide-in-right": "slide-in-right 0.4s ease-out forwards",
              "sheet-in": "slide-in-from-right 0.3s ease-out forwards, fade-in 0.3s ease-out forwards",
              "sheet-out": "slide-out-to-right 0.3s ease-in forwards, fade-out 0.3s ease-in forwards",
            },
          },
        },
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Print Utilities */
      @media print {
        @page { 
          margin: 4mm; 
          size: A4; 
        }
        body { 
          -webkit-print-color-adjust: exact; 
          print-color-adjust: exact; 
          font-size: 10px;
          line-height: 1.3;
        }
        .no-print { display: none !important; }
        .print-break-inside-avoid { break-inside: avoid; }
        * {
          page-break-inside: avoid;
          page-break-after: avoid;
        }
        h1, h2, h3, h4, h5, h6 {
          page-break-after: avoid;
          margin-top: 0.5em;
          margin-bottom: 0.3em;
        }
        table {
          page-break-inside: avoid;
        }
        tr {
          page-break-inside: avoid;
        }
      }

      /* Smooth Scroll */
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300">

  </body>
